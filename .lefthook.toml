[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-just]
glob = ["*.just", ".justfile"]
run = 'for f in {staged_files}; do just --justfile "$f" --fmt; done'
stage_fixed = true

[pre-commit.commands.format-mise]
glob = [".mise.toml", ".mise/config.toml"]
run = "mise fmt"
stage_fixed = true

[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown", "*.mdx"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
# oxfmt excludes *.sops.yaml itself and errors when every input is excluded,
# which a commit touching only secrets would otherwise trip.
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.shellcheck]
glob = ["*.sh"]
run = "shellcheck {staged_files}"

[pre-commit.commands.zizmor]
glob = [".github/workflows/*.yaml", ".github/actions/**/action.yaml"]
run = "zizmor --offline {staged_files}"

# sops always writes a top-level `sops:` block; a file without one was never encrypted.
[pre-commit.commands.check-sops-encrypted]
glob = ["*.sops.yaml"]
run = """
for file in {staged_files}; do
    grep -q '^sops:' "$file" || { echo "unencrypted: $file"; exit 1; }
done
"""
