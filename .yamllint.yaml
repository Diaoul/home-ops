---
extends: default

ignore: |
  *.sops.*
  /.venv/
  /talos/rendered/

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  # oxfmt owns indentation; yamllint's rule disagrees with its block-sequence style
  indentation: disable
  line-length: disable
  quoted-strings:
    required: false
    allow-quoted-quotes: true
  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
