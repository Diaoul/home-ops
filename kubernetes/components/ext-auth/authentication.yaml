---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-For
      - X-Forwarded-Proto
      - X-Auth-Request-Redirect
      - accept
      - authorization
      - cookie
    # A prefix keeps request paths off oauth2-proxy's own /ping, /ready and /robots.txt, which answer 200.
    http:
      path: /oauth2/auth
      backendRefs:
        - group: ""
          kind: Service
          name: oauth2-proxy
          namespace: security
          port: 4180
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        app.kubernetes.io/instance: ${APP}
      matchExpressions:
        - key: ext-auth.home-ops/skip
          operator: DoesNotExist
