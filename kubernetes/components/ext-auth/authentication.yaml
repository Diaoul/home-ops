---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-For
      - X-Forwarded-Proto
      - X-Auth-Request-Redirect
      - accept
      - authorization
      - cookie
    # oauth2-proxy answers its own /ping, /ready and /robots.txt with 200, which Envoy reads as allowed.
    http:
      path: /ext-auth
      backendRefs:
        - group: ""
          kind: Service
          name: oauth2-proxy
          namespace: security
          port: 4180
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
