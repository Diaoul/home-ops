---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Access to these stores is login-as-anyone (Authelia keys sessions by the raw
# cookie) or code execution (RomM's RQ worker unpickles queued jobs). The
# operator hardcodes --admin_nopass on 9999, which replication, the operator and
# metrics use, so a password on 6379 alone would leave each store open to every pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-dragonfly
spec:
  endpointSelector:
    matchLabels:
      app: ${APP}-dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ${APP}
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: ${APP}-dragonfly
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: dragonfly-operator
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
