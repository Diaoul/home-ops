---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: ${CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: miroir-local
    securityContext:
      runAsUser: 568
      runAsGroup: 568
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  verification:
    deep:
      schedule:
        cron: H 5 1 * *
    quick:
      schedule:
        cron: H 3 * * *
  volumeSnapshotClassName: ceph-block
