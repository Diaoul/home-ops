---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: nas
spec:
  configuration:
    endpointURL: https://singularity.milkyway:3901
    endpointCA:
      name: cloudnative-pg
      key: ca.crt
    destinationPath: s3://cloudnative-pg/
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg
        key: aws-access-key-id
      secretAccessKey:
        name: cloudnative-pg
        key: aws-secret-access-key
      region:
        name: cloudnative-pg
        key: aws-region
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 4
  retentionPolicy: 30d
