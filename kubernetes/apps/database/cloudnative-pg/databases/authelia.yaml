---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: authelia
spec:
  cluster:
    name: postgres18
  name: authelia
  login: true
  passwordSecret:
    name: authelia-db
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authelia
spec:
  cluster:
    name: postgres18
  name: authelia
  owner: authelia
