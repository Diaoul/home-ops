---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: coredns
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    priorityClassName: system-cluster-critical
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.43.0.10
    replicaCount: 2
    # No CPU limit: DNS work arrives in microbursts, and the chart's 100m limit
    # is 10ms of CPU per 100ms CFS period. A burst that overruns the quota
    # freezes CoreDNS for the rest of the period, and queries arriving during
    # the freeze are dropped in the socket buffer with no log and no counter.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # null, not omitted: Helm deep-merges values, so leaving cpu out lets
        # the chart's 100m default merge straight back in.
        cpu: null
        memory: 128Mi
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # Nodes have no IPv6 route, so AAAA answers only earn an ENETUNREACH and
          # spurious Flux ArtifactFailed events. NODATA leaves clients only A.
          # Ordering comes from CoreDNS' plugin.cfg, not this list.
          - name: template
            parameters: IN AAAA
            configBlock: |-
              rcode NOERROR
              authority "{{ .Zone }} 60 IN SOA ns.dns{{ .Zone }} hostmaster.dns{{ .Zone }} (1 60 60 60 60)"
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class all
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: coredns
            k8s-app: kube-dns
    podDisruptionBudget:
      maxUnavailable: 1
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
