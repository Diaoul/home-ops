---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-probe
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      vpn-probe:
        type: cronjob
        cronjob:
          schedule: "*/5 * * * *"
          timeZone: Europe/Paris
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 3600
        pod:
          restartPolicy: Never
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "vpn",
                "namespace": "network",
                "ips": ["10.0.90.10/24"],
                "mac": "32:0b:d8:1f:b6:f1"
              }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
        containers:
          app:
            image:
              repository: docker.io/alpine/curl
              tag: 8.23.0@sha256:423fe846edd6e4d3181e3092f2c322c85861871d0dc1e774346e1d02684e5e4c
            command:
              - /scripts/probe.sh
            env:
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: vpn-probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    persistence:
      scripts:
        type: configMap
        name: vpn-probe
        defaultMode: 0775
        globalMounts:
          - readOnly: true
