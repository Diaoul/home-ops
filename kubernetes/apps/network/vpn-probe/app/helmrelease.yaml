---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-probe
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      vpn-probe:
        type: cronjob
        cronjob:
          schedule: "*/5 * * * *"
          backoffLimit: 0
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "vpn",
                "namespace": "network",
                "ips": ["10.0.90.10/24"],
                "mac": "32:0b:d8:1f:b6:f1"
              }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
        containers:
          app:
            image:
              repository: docker.io/alpine/curl
              tag: 8.23.0@sha256:c8df739636f42117e358bdffb4c243c460b31cbba8cc69241a22ab519546f34d
            command:
              - /scripts/probe.sh
            envFrom:
              - secretRef:
                  name: vpn-probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    persistence:
      scripts:
        type: configMap
        name: vpn-probe
        defaultMode: 0775
