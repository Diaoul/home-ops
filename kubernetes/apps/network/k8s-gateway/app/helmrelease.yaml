---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  values:
    fullnameOverride: k8s-gateway
    replicaCount: 2
    priorityClassName: system-cluster-critical
    service:
      annotations:
        lbipam.cilium.io/ips: 10.44.0.3
      externalTrafficPolicy: Cluster
    servers:
      - zones:
          - zone: .
        port: 53
        plugins:
          - name: k8s_gateway
            parameters: ${DOMAIN}
            configBlock: |-
              apex k8s-gateway.network
              ttl 300
              resources HTTPRoute Service
              fallthrough andromeda.${DOMAIN} sunflower.${DOMAIN}
          - name: log
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
          - name: file
            parameters: /etc/coredns/sunflower.${DOMAIN}.db sunflower.${DOMAIN}
          - name: file
            parameters: /etc/coredns/andromeda.${DOMAIN}.db andromeda.${DOMAIN}
    zoneFiles:
      - filename: sunflower.${DOMAIN}.db
        contents: |
          sunflower.${DOMAIN}.   IN SOA k8s-gateway.sunflower.${DOMAIN}. admin.sunflower.${DOMAIN}. 2023120101 7200 3600 1209600 300
          sunflower.${DOMAIN}.   IN NS  k8s-gateway.sunflower.${DOMAIN}.
          sunflower.${DOMAIN}.   IN CNAME papouf.synology.me.
          *.sunflower.${DOMAIN}. IN CNAME papouf.synology.me.
      - filename: andromeda.${DOMAIN}.db
        contents: |-
          andromeda.${DOMAIN}.   IN SOA k8s-gateway.andromeda.${DOMAIN}. admin.andromeda.${DOMAIN}. 2023120101 7200 3600 1209600 300
          andromeda.${DOMAIN}.   IN NS  k8s-gateway.andromeda.${DOMAIN}.
          andromeda.${DOMAIN}.   IN CNAME pretongirl.synology.me.
          *.andromeda.${DOMAIN}. IN CNAME pretongirl.synology.me.
