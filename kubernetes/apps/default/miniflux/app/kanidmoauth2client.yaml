---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: miniflux
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Miniflux
  origin: https://miniflux.${DOMAIN}/
  redirectUrl:
    - https://miniflux.${DOMAIN}/oauth2/oidc/callback
  scopeMap:
    - group: family
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true
  secretKeyAliases:
    clientId:
      - OAUTH2_CLIENT_ID
    clientSecret:
      - OAUTH2_CLIENT_SECRET
