---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      vaultwarden:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: vaultwarden/server
              tag: 1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
            env:
              DOMAIN: https://vaultwarden.${DOMAIN}
              TZ: Europe/Paris
              SIGNUPS_ALLOWED: false
              WEBSOCKET_ENABLED: true
              SMTP_HOST: 10.0.3.1
              SMTP_PORT: 25
              SMTP_FROM: admin@${DOMAIN}
              SMTP_SECURITY: "off"
            envFrom:
              - secretRef:
                  name: vaultwarden
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                memory: 500Mi
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - vaultwarden.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
      admin:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - vaultwarden.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /admin
            backendRefs:
              - name: vaultwarden
                port: 80
    persistence:
      data:
        existingClaim: vaultwarden
