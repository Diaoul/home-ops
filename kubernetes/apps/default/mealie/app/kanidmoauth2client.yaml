---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: mealie
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Mealie
  origin: https://mealie.${DOMAIN}/
  redirectUrl:
    - https://mealie.${DOMAIN}/login
  scopeMap:
    - group: family
      scopes:
        - openid
        - email
        - profile
        - groups_name
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true
  secretKeyAliases:
    clientId:
      - OIDC_CLIENT_ID
    clientSecret:
      - OIDC_CLIENT_SECRET
