---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/miroir.home-operations.com/miroirnodegroup_v1alpha1.json
apiVersion: miroir.home-operations.com/v1alpha1
kind: MiroirNodeGroup
metadata:
  name: default
spec:
  # Every node now carries an r-miroir partition, so match them all. An empty
  # selector is the Kubernetes convention for "every node" and means a new node
  # joins the pool automatically — but only once its partition exists, so a
  # rebuilt node needs 62-volumes.yaml applied before it can serve storage.
  nodeSelector: {}
  template:
    pools:
      - name: default
        lvmthin:
          device: /dev/disk/by-partlabel/r-miroir
