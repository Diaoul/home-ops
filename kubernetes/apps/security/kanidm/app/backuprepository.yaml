---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmbackuprepository_v1alpha1.json
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupRepository
metadata:
  name: nas
spec:
  authentication:
    deleter:
      secretRef:
        name: kanidm-backup
    reader:
      secretRef:
        name: kanidm-backup
    writer:
      secretRef:
        name: kanidm-backup
  encryption:
    mode: clientSide
    keyRef:
      name: kanidm-backup
  s3:
    bucket: kanidm
    caBundleRef:
      name: milkyway-ca
      key: ca.crt
    endpoint: https://singularity.milkyway:3901
    forcePathStyle: true
    prefix: kanidm
    region: garage
