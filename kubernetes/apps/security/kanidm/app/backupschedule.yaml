---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmbackupschedule_v1alpha1.json
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupSchedule
metadata:
  name: kanidm
spec:
  jitterSeconds: 300
  kanidmRef:
    name: kanidm
  localVersions: 7
  repositoryRef:
    name: nas
  retention:
    keepLast: 8
    daily: 7
    weekly: 4
    monthly: 6
    minAge: 24h
  schedule: 30 2 * * *
  timeZone: Europe/Paris
