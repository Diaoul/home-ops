---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kaniop
spec:
  targetNamespace: security
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/security/kanidm/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm
spec:
  targetNamespace: security
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/security/kanidm/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  healthChecks:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      name: kanidm
      namespace: security
  healthCheckExprs:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      current: status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
      failed: status.conditions.exists(c, c.type == 'Available' && c.status == 'False')
  dependsOn:
    - name: kaniop
    - name: rook-ceph-cluster
      namespace: rook-ceph
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
