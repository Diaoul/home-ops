---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# authelia-dragonfly holds every live Authelia session, keyed by the raw cookie
# value: reading it means logging in as anyone. The operator hardcodes
# --admin_nopass on 9999, which replication, the operator and metrics use, so a
# password on 6379 alone would leave the store open to every pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia-dragonfly
spec:
  endpointSelector:
    matchLabels:
      app: authelia-dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: authelia
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: authelia-dragonfly
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: dragonfly-operator
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
