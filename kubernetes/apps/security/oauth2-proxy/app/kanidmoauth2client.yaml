---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: oauth2-proxy
spec:
  kanidmRef:
    name: kanidm
  displayname: oauth2-proxy
  origin: https://prowlarr.${DOMAIN}/
  redirectUrl:
    - https://bazarr.${DOMAIN}/oauth2/callback
    - https://prowlarr.${DOMAIN}/oauth2/callback
    - https://radarr.${DOMAIN}/oauth2/callback
    - https://sabnzbd.${DOMAIN}/oauth2/callback
    - https://sonarr.${DOMAIN}/oauth2/callback
  scopeMap:
    - group: users
      scopes:
        - openid
        - profile
        - email
        - groups
  strictRedirectUrl: true
  preferShortUsername: true
  disableConsentPrompt: true
