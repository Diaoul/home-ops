---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.6.0@sha256:51091200afb8afd9f1dba07596e9e81a96d499e42ff96fee676b29a7cac24016
            env:
              TZ: Europe/Paris
              AUTH_METHOD: oidc
              OIDC_DISCOVERY_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
              OIDC_CLIENT_ID: shelfmark
              OIDC_ADMIN_GROUP: admins
              OIDC_AUTO_PROVISION: "true"
              OIDC_AUTO_REDIRECT: "true"
              HIDE_LOCAL_AUTH: "true"
              INGEST_DIR: /books # book destination
              DESTINATION_AUDIOBOOK: /media/audiobooks
              FILE_ORGANIZATION_AUDIOBOOK: organize
              TEMPLATE_AUDIOBOOK_ORGANIZE: "{Author}/{Title}/{Title}"
              PROWLARR_TORRENT_CLIENT: qbittorrent
              QBITTORRENT_URL: http://qbittorrent.downloads.svc.cluster.local:8080
              QBITTORRENT_CATEGORY: books
              QBITTORRENT_CATEGORY_AUDIOBOOK: audiobook
            envFrom:
              - secretRef:
                  name: shelfmark
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8084
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: shelfmark
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - shelfmark.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: shelfmark
                port: *port
    persistence:
      config:
        existingClaim: shelfmark
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: singularity.milkyway
        path: /volume1/media
        globalMounts:
          - path: /media
          - path: /books
            subPath: downloads/bookdrop
      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: var-log
