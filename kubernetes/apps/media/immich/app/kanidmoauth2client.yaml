---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: immich
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Immich
  origin: https://immich.${DOMAIN}/
  redirectUrl:
    - https://immich.${DOMAIN}/auth/login
    - https://immich.${DOMAIN}/user-settings
    # Immich forwards this to the app.immich:// scheme the mobile app listens on.
    - https://immich.${DOMAIN}/api/oauth/mobile-redirect
  scopeMap:
    - group: family
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true
  claimMap:
    - name: immich_role
      joinStrategy: array
      valuesMap:
        - group: family
          values:
            - user
        - group: admins
          values:
            - admin
