---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR__API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    media_management:
      # Required by the guides: the [Required] Repack/Proper CF group handles
      # propers/repacks via scores, so Sonarr's built-in preference must be off.
      propers_and_repacks: do_not_prefer
    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        # Keep false: applies the TRaSH scheme to NEW imports only. Flipping to
        # true mass-renames the existing library on singularity.milkyway. Safe
        # for seeding (hardlinked imports keep their own qBittorrent path), but
        # it is a large, irreversible filesystem operation — enable deliberately.
        rename: false
        standard: default
        daily: default
        anime: default
    quality_profiles:
      # WEB-1080p
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
      # WEB-2160p
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
      # FR-MULTi-VO-WEB-1080p
      - trash_id: 4c48f506c1116a3a57ae33f12346bd15 # [French MULTi.VO] HD Bluray + WEB (1080p)
        name: FR-MULTi-VO-WEB-1080p
        reset_unmatched_scores:
          enabled: true
      # FR-MULTi-VO-WEB-2160p
      - trash_id: 6fa7364373e8f06206871d9c20a4fb3e # [French MULTi.VO] UHD Bluray + WEB (2160p)
        name: FR-MULTi-VO-WEB-2160p
        reset_unmatched_scores:
          enabled: true
      # Remux-1080p - Anime
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        name: Remux-1080p - Anime
        reset_unmatched_scores:
          enabled: true
    # Custom Format Groups (opt-in). Groups flagged `default: true` in the guide
    # (Unwanted Formats, Streaming Services General, HD/UHD boost, Golden Rule,
    # HDR, Language Profiles) are auto-synced and need no entry here.
    custom_format_groups:
      add:
        - trash_id: d920fd959d220306888f40b6f38e1578 # [Optional] Season Packs
        - trash_id: bad5bc85573a0134e1e1987c46f67e98 # [Optional] Accessibility
          select_all: true
        - trash_id: f54985e5e96747cef58731f1cf4c9181 # [Streaming Services] Anime
        # Adding these explicitly opts them out of auto-sync and switches to
        # required + default + select semantics, so the defaults still apply.
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          select:
            - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
            - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
            - 06d66ab109d4d2eddb2794d21526d140 # Retags
            - 1b3994c551cbb92a2c781af061f4ab44 # Scene
        - trash_id: a23c8675c79118544fd74153394fa589 # [Unwanted] Unwanted Formats French
          select:
            # Scene is not offered by the French group (its FR score is 0 anyway)
            - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
            - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
            - 06d66ab109d4d2eddb2794d21526d140 # Retags
        - trash_id: 7d366c213e5c23a052b157356fac1921 # [HDR Formats] HDR10+ Boost
        - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
        - trash_id: e1053c0ef622df3749fa43c22865663a # [HDR Formats] SDR
          select:
            - 83304f261cf516bb208c18c54c0adf97 # SDR (no WEBDL)
    # x265 is left to the guide's Golden Rule: [Optional] Golden Rule HD blocks
    # x265 (HD) on the 1080p profiles, [Optional] Golden Rule UHD blocks
    # x265 (no HDR/DV) on the 2160p ones. Both auto-sync — nothing to declare.
    # The anime profile is not in either group's include list, so 1080p HEVC
    # anime is unaffected.
    custom_formats:
      # Block FanSUB
      - trash_ids:
          - 84f0acbda9c0c9de783894fb66df25aa # FanSUB
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: -10000
          - name: FR-MULTi-VO-WEB-2160p
            score: -10000
      # French preferences (101 for preferred, 0 or -101 for others)
      - trash_ids:
          - 2c29a39a4fdfd6d258799bc4c09731b9 # VFF
          - 7ae924ee9b2f39df3283c6c0beb8a2aa # VOF
          - b6816a0e1d4b64bf3550ad3b74b009b6 # VFI
          - 34789ec3caa819f087e23bbf9999daf7 # VF2
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: 101
          - name: FR-MULTi-VO-WEB-2160p
            score: 101
      - trash_ids:
          - 7a7f4e4f58bd1058440236d033a90b67 # VFQ
          - 802dd70b856c423a9b0cb7f34ac42be1 # VOQ
          - 82085412d9a53ba8d8e46fc624eb701d # VQ
          - 0ce1e39a4676c6692ce47935278dac76 # VFB
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: 0
          - name: FR-MULTi-VO-WEB-2160p
            score: 0
      # Anime
      - trash_ids:
          - 026d5aadd1a6b4e550b134cb6c72b3ca # Uncensored
          - b2550eb333d27b75833e25b8c2557b38 # 10bit
          - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 0

radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR__API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    media_management:
      # Required by the guides: the [Required] Repack/Proper CF group handles
      # propers/repacks via scores, so Radarr's built-in preference must be off.
      propers_and_repacks: do_not_prefer
    media_naming:
      folder: jellyfin-tmdb
      movie:
        # Keep false: applies the TRaSH scheme to NEW imports only. Flipping to
        # true mass-renames the existing library on singularity.milkyway. Safe
        # for seeding (hardlinked imports keep their own qBittorrent path), but
        # it is a large, irreversible filesystem operation — enable deliberately.
        rename: false
        standard: jellyfin-tmdb
    quality_profiles:
      # HD Bluray + WEB
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      # UHD Bluray + WEB
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        name: UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      # FR-MULTi-VO-HD
      - trash_id: 2572ce3ea4eef1c19d59e0e20ed1cea7 # [French MULTi.VO] HD Bluray + WEB
        name: FR-MULTi-VO-HD
        reset_unmatched_scores:
          enabled: true
      # FR-MULTi-VO-UHD
      - trash_id: 92ead7022d13a7858d54e328e6a2f8f9 # [French MULTi.VO] UHD Bluray + WEB
        name: FR-MULTi-VO-UHD
        reset_unmatched_scores:
          enabled: true
    # Custom Format Groups (opt-in). Groups flagged `default: true` in the guide
    # (Unwanted Formats, Streaming Services General, Golden Rule, HDR, and
    # [Audio] Audio Formats on the UHD profiles) are auto-synced — no entry needed.
    custom_format_groups:
      add:
        - trash_id: f4f1474b963b24cf983455743aa9906c # [Optional] Movie Versions
          select_all: true
        - trash_id: bc3c13e52f2971319bc1748ffa3d1078 # [Optional] Accessibility
          select_all: true
        - trash_id: f993ad37540147e4d00e66503545d81b # [Streaming Services] Anime
        # Adding these explicitly opts them out of auto-sync and switches to
        # required + default + select semantics, so the defaults still apply.
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
          select:
            - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
            - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
            - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
            - f537cf427b64c38c8e36298f657e4828 # Scene
        - trash_id: 59f7ab9ff64d0026b011b985b1cc8670 # [Unwanted] Unwanted Formats French
          select:
            # Scene is not offered by the French group
            - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
            - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
            - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
        - trash_id: b29413a7487478fe98228ce79e5689e4 # [HDR Formats] HDR10+ Boost
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
        - trash_id: 47f0d69750de9e16855915fa73bb7b08 # [HDR Formats] SDR
          select:
            - 25c12f78430a3a23413652cbd1d48d77 # SDR (no WEBDL)
    # x265 is left to the guide's Golden Rule: [Optional] Golden Rule HD blocks
    # x265 (HD) on the HD profiles, [Optional] Golden Rule UHD blocks
    # x265 (no HDR/DV) on the UHD ones. Both auto-sync — nothing to declare.
    custom_formats:
      # UHD Audio: no longer listed here. [Audio] Audio Formats (9d5acd8f1da78dfbae788182f7605200)
      # is a `default: true` CF group in the guide, so its scores are applied
      # automatically to UHD Bluray + WEB and FR-MULTi-VO-UHD. To opt out, add:
      #   custom_format_groups:
      #     skip: [9d5acd8f1da78dfbae788182f7605200]
      # Block FanSUB
      - trash_ids:
          - 02e48d30a176c91baf9e15de05e5dc6a # FanSUB
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: -10000
          - name: FR-MULTi-VO-UHD
            score: -10000
      # French preferences (101 for preferred, 0 or -101 for others)
      - trash_ids:
          - 404c08fd0bd67f39b4d8e5709319094e # VFF
          - 4cafa20d5584f6ba1871d1b8941aa3cb # VOF
          - 52772f1cad6b5d26c2551f79bc538a50 # VFI
          - 29b5f7b1a5f20f64228786c3ab1bdc7d # VF2
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: 101
          - name: FR-MULTi-VO-UHD
            score: 101
      - trash_ids:
          - b6ace47331a1d3b77942fc18156f6df6 # VFQ
          - f7caa1942be5cc547c266bd3dbc2cda9 # VOQ
          - 95aa50f71a01c82354a7a2b385f1c4d8 # VQ
          - b3fb499641d7b3c2006be1d9eb014cb3 # VFB
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: 0
          - name: FR-MULTi-VO-UHD
            score: 0
