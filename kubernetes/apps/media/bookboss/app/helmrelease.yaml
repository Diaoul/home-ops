---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookboss
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      bookboss:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/szinn/bookboss
              tag: v0.8.40@sha256:0d900b26739ad4e6385ad0e949ef69bbd8d2ca887939020c9098d6bed974b37b
            env:
              TZ: Europe/Paris
              BOOKBOSS__DATABASE__DATABASE_URL: sqlite:///data/bookboss.db?mode=rwc
              BOOKBOSS__FRONTEND__BASE_URL: https://bookboss.${DOMAIN}
              BOOKBOSS__FRONTEND__LISTEN_PORT: &port 8080
              BOOKBOSS__LIBRARY__LIBRARY_PATH: /library/books
              BOOKBOSS__IMPORT__BOOKDROP_PATH: /library/bookdrop
              BOOKBOSS__OIDC__DISCOVERY_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
              BOOKBOSS__OIDC__CLIENT_ID: bookboss
              BOOKBOSS__OIDC__BUTTON_LABEL: Sign in with Authelia
            envFrom:
              - secretRef:
                  name: bookboss
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: bookboss
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - bookboss.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: bookboss
        globalMounts:
          - path: /data
      media:
        type: nfs
        server: singularity.milkyway
        path: /volume1/media
        globalMounts:
          - path: /library/books
            subPath: books
          - path: /library/bookdrop
            subPath: downloads/bookdrop
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
