---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: audiobookshelf
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Audiobookshelf
  origin: https://audiobookshelf.${DOMAIN}/
  redirectUrl:
    - https://audiobookshelf.${DOMAIN}/auth/openid/callback
    - https://audiobookshelf.${DOMAIN}/auth/openid/mobile-redirect
    - audiobookshelf://oauth
  scopeMap:
    - group: family
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true
