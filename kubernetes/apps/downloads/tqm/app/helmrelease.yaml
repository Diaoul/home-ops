---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tqm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      tqm:
        type: cronjob
        initContainers:
          retag: &container
            image: &id001
              repository: ghcr.io/home-operations/tqm
              tag: 1.20.0@sha256:c5bdff16ca1107712fd61dc6c39a276488908c702e68e427db889419af042761
            args:
              - retag
              - qb
            securityContext: &id002
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources: &id003
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        containers:
          clean:
            <<: *container
            image: *id001
            args:
              - clean
              - qb
            securityContext: *id002
            resources: *id003
        pod:
          restartPolicy: Never
        cronjob: &cronJobSpec
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 3600
      orphaned:
        type: cronjob
        containers:
          app:
            <<: *container
            image: *id001
            args:
              - orphan
              - qb
              - --dry-run
            securityContext: *id002
            resources: *id003
        pod:
          restartPolicy: Never
        cronjob:
          <<: *cronJobSpec
          schedule: 0 0 * * 0
          suspend: true
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /.config/tqm
      config-file:
        type: configMap
        name: tqm
        globalMounts:
          - path: /.config/tqm/config.yaml
            subPath: config.yaml
      media:
        type: nfs
        server: singularity.milkyway
        path: /volume1/media
        globalMounts:
          - path: /media/downloads/torrents
            subPath: downloads/torrents
            readOnly: true
