---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: autobrr
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: autobrr
  origin: https://autobrr.${DOMAIN}/
  redirectUrl:
    - https://autobrr.${DOMAIN}/api/auth/oidc/callback
  scopeMap:
    - group: admins
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true
  secretKeyAliases:
    clientId:
      - AUTOBRR__OIDC_CLIENT_ID
    clientSecret:
      - AUTOBRR__OIDC_CLIENT_SECRET
