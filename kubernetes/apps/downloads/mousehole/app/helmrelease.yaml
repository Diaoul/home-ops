---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mousehole
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      mousehole:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "vpn",
                "namespace": "network",
                "ips": ["10.0.90.9/24"],
                "mac": "32:0b:d8:1f:b6:e0"
              }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: docker.io/tmmrtn/mousehole
              tag: 0.5.0@sha256:2fc02b12362581e60bfd6adba788bda9eda93f8f31ed089581eeabcee4518b0d
            env:
              TZ: Europe/Paris
              MOUSEHOLE_STATE_DIR_PATH: /config
              MOUSEHOLE_INSECURE_ALLOW_NO_AUTH: "true"
              MOUSEHOLE_ALLOWED_HOSTS: mousehole.${DOMAIN}
              # TLS ends at Envoy, so same-origin would expect http://
              MOUSEHOLE_ALLOWED_ORIGINS: https://mousehole.${DOMAIN}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 5010
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://mousehole.${DOMAIN}/health
            conditions: ["[STATUS] == 200", "[BODY].lastMamContactResult == any(ok, throttled)"]
        hostnames:
          - mousehole.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: mousehole
      tmp:
        type: emptyDir
