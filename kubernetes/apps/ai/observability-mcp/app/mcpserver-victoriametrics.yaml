---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: victoriametrics-mcp
spec:
  alias: victoriametrics
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.120.1@sha256:16d9a30a6629319a8e84a73b9b54e1e9b9e5bf229bc40a7f1717c8602b0c1c09
    port: 8080
    path: /mcp
    env:
      - name: VM_INSTANCE_ENTRYPOINT
        value: http://victoria-metrics-server.observability.svc.cluster.local:8428
      - name: VM_INSTANCE_TYPE
        value: single
      - name: MCP_SERVER_MODE
        value: http
      - name: MCP_LISTEN_ADDR
        value: :8080
      - name: TZ
        value: Europe/Paris
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi
