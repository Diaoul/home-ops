---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./helmrelease.yaml
  - ./kanidmoauth2client.yaml
  - ./litellmteam.yaml
  - ./litellmvirtualkey.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - ./resources/config.yaml
      - ./resources/hindsight.json
      - ./resources/hindsight-dev.json
      # Hermes merges the managed .env into every profile, which never sees the pod env.
      - .env=./resources/managed.env
  - name: hermes-mise
    files:
      - ./resources/mise.toml
  - name: hermes-scripts
    files:
      - ./resources/teuzig-mentions.py
    options:
      annotations:
        # Keeps Flux from substituting the GraphQL query's $id.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
