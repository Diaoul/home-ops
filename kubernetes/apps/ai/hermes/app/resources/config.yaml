---
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes
      issuer: https://idm.${DOMAIN}/oauth2/openid/hermes
      scopes: openid profile email
  public_url: https://hermes-dash.${DOMAIN}

memory:
  provider: hindsight

providers:
  litellm:
    api: http://litellm.ai.svc.cluster.local:4000/v1
    discover_models: true
    key_env: LITELLM_API_KEY
    name: LiteLLM
    transport: chat_completions

secrets:
  command:
    enabled: true
    helper_timeout_seconds: 3
    override_existing: true
    # Multiplexed profiles don't see the pod env, so each key is read from its mounted file.
    command: printf 'LITELLM_API_KEY=%s\nHINDSIGHT_API_KEY=%s\n' "$(cat /mnt/secrets/litellm/key)" "$(cat /mnt/secrets/hindsight/key)"

security:
  allow_lazy_installs: false
  redact_secrets: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  env_passthrough:
    - MISE_CACHE_DIR
    - MISE_DATA_DIR
    - MISE_GLOBAL_CONFIG_FILE
    - MISE_STATE_DIR
    - SEARXNG_URL

web:
  extract_backend: firecrawl
  keyless_fallback: false
  search_backend: searxng

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.${DOMAIN}
