apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: hermes
spec:
  alias: hermes
  # Virtual keys get no MCP servers unless their team grants them.
  mcpServers:
    - ha_mcp
    - kubernetes
    - flux
    - github
    - unifi
    - victorialogs
    - victoriametrics
  models:
    - glm-5-3-flash-openrouter
    - deepseek-v4-1-flash-openrouter
    - deepseek-v4-1-flash-1017-openrouter
    - gpt-6-luna-openrouter
    - minimax-m3-1-flash-openrouter
    - kimi-k3-1-pro-openrouter
    - claude-haiku-5-5
    - claude-sonnet-5-5
    - claude-opus-5-5
  proxyRef: litellm
