---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
    disable_env_credential_login: true
    # e.g. for x-opencode-session
    forward_client_headers_to_llm_api: true
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
    # A rig that sleeps should drop out on the first failure and stay out, rather
    # than being re-probed every 5s (the defaults are 3 fails / 5s).
    allowed_fails: 1
    cooldown_time: 300
    # No fallback for qwen3-local on purpose: a silent hop to haiku would mask a
    # sleeping rig or a slow backend. Re-add once its behaviour is understood.
    context_window_fallbacks:
      - claude-haiku-4-5:
          - claude-sonnet-5
      - claude-sonnet-5:
          - claude-opus-5
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm
          key: DATABASE_URL
    - name: PROXY_BASE_URL
      value: https://litellm.${DOMAIN}
    - name: PROXY_ADMIN_ID
      value: antoine
    - name: GENERIC_CLIENT_ID
      value: litellm
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_OAUTH_CLIENT_SECRET
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://auth.${DOMAIN}/api/oidc/authorization
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://auth.${DOMAIN}/api/oidc/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://auth.${DOMAIN}/api/oidc/userinfo
    - name: GENERIC_SCOPE
      value: openid email profile
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.${DOMAIN}
    parentRefs:
      - name: envoy-internal
        namespace: network
