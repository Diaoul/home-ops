---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
  replicas: 1
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  generalSettings:
    health_check_endpoint: /v1/health
    disable_env_credential_login: true
    # e.g. for x-opencode-session
    forward_client_headers_to_llm_api: true
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
    context_window_fallbacks:
      - claude-haiku-5-5:
          - claude-sonnet-5-5
      - claude-sonnet-5-5:
          - claude-opus-5-5
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm
          key: DATABASE_URL
    - name: PROXY_BASE_URL
      value: https://litellm.${DOMAIN}
    - name: PROXY_ADMIN_ID
      value: antoine
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-kanidm-oauth2-credentials
          key: CLIENT_ID
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-kanidm-oauth2-credentials
          key: CLIENT_SECRET
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://idm.${DOMAIN}/ui/oauth2
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://idm.${DOMAIN}/oauth2/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://idm.${DOMAIN}/oauth2/openid/litellm/userinfo
    - name: GENERIC_SCOPE
      value: openid email profile
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.${DOMAIN}
    parentRefs:
      - name: envoy-internal
        namespace: network
