---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      hindsight:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate # one pod per worker id
        containers:
          app:
            image: &image
              repository: ghcr.io/vectorize-io/hindsight-api
              tag: 1.2.3@sha256:2f318da3489f6493a5ec78f3d7019cd70835383fe4f4ffd1af9e080babd91d6c
            env:
              HINDSIGHT_API_LLM_PROVIDER: openai
              HINDSIGHT_API_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              HINDSIGHT_API_LLM_MODEL: deepseek-v4-1-flash-1017-openrouter
              HINDSIGHT_API_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-litellm
                    key: key
              HINDSIGHT_API_MCP_STATELESS: "true"
              HINDSIGHT_API_WORKER_ID: hindsight
              HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
              # The embedding and reranking models are baked into the image.
              HF_HUB_OFFLINE: "1"
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: hindsight
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &port 8888
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Migrations and model loading run before the server listens.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        initContainers:
          # Banks are configured through the API only; this applies resources/banks once it is up.
          import-banks:
            image: *image
            command:
              - /app/api/.venv/bin/python
              - /banks/import-banks.py
            envFrom:
              - secretRef:
                  name: hindsight
            restartPolicy: Always
            securityContext: *securityContext
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
        pod:
          # The in-process worker drains for about 27s on shutdown.
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    service:
      app:
        controller: hindsight
        ports:
          http:
            port: *port
    persistence:
      banks:
        type: configMap
        name: hindsight-banks
        advancedMounts:
          hindsight:
            import-banks:
              - path: /banks
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
