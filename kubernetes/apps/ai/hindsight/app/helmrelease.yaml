---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      hindsight:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate # one pod per worker id
        containers:
          app:
            image:
              repository: ghcr.io/vectorize-io/hindsight-api
              tag: 1.3.0@sha256:c054765e9196fb1fe63497be06bcb55256c9024cc9314f951dc59858985ab242
            env:
              HINDSIGHT_API_LLM_PROVIDER: openai
              HINDSIGHT_API_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              HINDSIGHT_API_LLM_MODEL: deepseek-v4-1-flash-1017-openrouter
              HINDSIGHT_API_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-litellm
                    key: key
              HINDSIGHT_API_MCP_STATELESS: "true"
              HINDSIGHT_API_WORKER_ID: hindsight
              HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
              # The embedding and reranking models are baked into the image.
              HF_HUB_OFFLINE: "1"
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: hindsight
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &port 8888
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Migrations and model loading run before the server listens.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        pod:
          # The in-process worker drains for about 27s on shutdown.
          terminationGracePeriodSeconds: 60
          securityContext: &podSecurityContext
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
      control-plane:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/vectorize-io/hindsight-control-plane
              tag: 1.2.3@sha256:29c8fd38a6408b76f08219badc1e506b1b3bb77264d8e1cdfc327e4f955d99f8
            # The image's start script insists on a writable embedded-database directory,
            # which only the API uses.
            command:
              - node
              - server.js
            workingDir: /app/control-plane
            env:
              HINDSIGHT_CP_DATAPLANE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight
                    key: HINDSIGHT_API_TENANT_API_KEY
              HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight.ai.svc.cluster.local:8888
              HOSTNAME: 0.0.0.0
              PORT: &cpPort 3000
              TZ: Europe/Paris
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          securityContext: *podSecurityContext
    service:
      app:
        controller: hindsight
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: *port
      control-plane:
        controller: control-plane
        ports:
          http:
            port: *cpPort
    route:
      app:
        hostnames:
          - hindsight.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: control-plane
                port: *cpPort
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
