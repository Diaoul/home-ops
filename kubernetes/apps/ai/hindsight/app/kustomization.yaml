---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./litellmvirtualkey.yaml
  - ./mcpserver.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: hindsight-banks
    files:
      - ./resources/banks/home.json
      - ./resources/import-banks.py
generatorOptions:
  disableNameSuffixHash: true
