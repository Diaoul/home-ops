---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hindsight
spec:
  # Retain runs unattended after every turn, so a loop would spend with nobody watching.
  maxBudget: "5"
  budgetDuration: 30d
  keyAlias: hindsight
  models:
    - deepseek-v4-1-flash-1017-openrouter
  proxyRef: litellm
  secretName: hindsight-litellm
