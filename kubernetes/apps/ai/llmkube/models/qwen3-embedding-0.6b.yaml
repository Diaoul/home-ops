---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0.6b
spec:
  source: hf://Qwen/Qwen3-Embedding-0.6B-GGUF
  files:
    - Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: intel
    gpu:
      enabled: true
      vendor: intel
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding-0.6b
spec:
  modelRef: qwen3-embedding-0.6b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10603@sha256:033d0cd1352d6e9cd87337772f530e2087cffed6284d9f47c2b859982c470b3b
  replicas: 1
  priority: normal
  contextSize: 4096
  parallelSlots: 1
  # --pooling last is non-causal, so uBatchSize bounds the largest single input
  # (a sequence may not straddle micro-batches) AND sizes a uBatch² × 16-head
  # score buffer — 1GB at 4096, 4GB at 8192, past what the iGPU will allocate in
  # one go. 2048 tokens is ~8x an Open WebUI RAG chunk. batchSize stays at the
  # context so a multi-chunk request still queues in one pass.
  batchSize: 4096
  uBatchSize: 2048
  extraArgs:
    - --alias
    - qwen3-embedding
    - --embeddings
    - --pooling
    - last
    - --cont-batching
    # Coffee Lake-U: 4 physical cores, 8 threads
    - --threads
    - "4"
    - --threads-batch
    - "8"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  resources:
    cpu: 100m
    # Working set peaks at ~3.2GB once the compute buffers are faulted in, which
    # only happens under traffic — an idle pod measures ~1GB lower and will
    # under-reserve if you size from it.
    memory: 3.5Gi
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
