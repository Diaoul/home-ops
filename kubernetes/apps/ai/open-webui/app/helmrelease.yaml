---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
            env:
              TZ: Europe/Paris
              WEBUI_URL: https://chat.${DOMAIN}
              # Backends
              ENABLE_OLLAMA_API: false
              ENABLE_OPENAI_API: true
              OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              # OAuth
              ENABLE_LOGIN_FORM: false
              ENABLE_SIGNUP: false
              ENABLE_OAUTH_SIGNUP: true
              ENABLE_OAUTH_PERSISTENT_CONFIG: false
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: Authelia
              OPENID_PROVIDER_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.${DOMAIN}/oauth/oidc/callback
              OAUTH_SCOPES: openid email profile groups
              # Authelia's client is configured require_pkce: true
              OAUTH_CODE_CHALLENGE_METHOD: S256
              # Embeddings — RAG_OPENAI_* inherit OPENAI_API_BASE_URL/KEY, i.e. litellm
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: qwen3-embedding-0.6b
              RAG_EMBEDDING_BATCH_SIZE: 16
              # Search
              ENABLE_WEB_SEARCH: true
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.default.svc.cluster.local:8080/search?q=<query>
              # Websockets
              ENABLE_WEBSOCKET_SUPPORT: true
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: redis://open-webui-dragonfly.ai.svc.cluster.local:6379
            envFrom:
              - secretRef:
                  name: open-webui
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - chat.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
