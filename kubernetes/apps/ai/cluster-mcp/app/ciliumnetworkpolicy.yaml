---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Unauthenticated servers holding a cluster-wide read token. Egress is an allow-list rather
# than egressDeny on open egress, so nothing they read can be sent to the internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cluster-mcp
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - flux-mcp
          - kubernetes-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    # kubernetes-mcp-server dials the API server by this name, not its IP. Any other
    # lookup is refused, as a query name can carry data out.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: kubernetes.default.svc
              - matchName: kubernetes.default.svc.cluster.local
              - matchName: kubernetes.default.svc.svc.cluster.local
              - matchName: kubernetes.default.svc.ai.svc.cluster.local
