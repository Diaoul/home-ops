---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Unauthenticated servers holding a cluster-wide read token. Egress is an allow-list rather
# than egressDeny on open egress, so nothing they read can be sent to the internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cluster-mcp
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - flux-mcp
          - kubectl-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
