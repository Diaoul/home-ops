---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubernetes-mcp
spec:
  alias: kubernetes
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/containers/kubernetes-mcp-server:v0.1.2@sha256:c289505b06079d7f265a6fef977ce1abbfbbb4271772db17db5b58edbf44c255
    port: 8080
    path: /mcp
    serviceAccountName: cluster-mcp
    automountServiceAccountToken: true
    env:
      - name: TZ
        value: Europe/Paris
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    volumes:
      - name: config
        configMap:
          name: kubernetes-mcp-config
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: config
        mountPath: /etc/kubernetes-mcp-server
        readOnly: true
      - name: tmp
        mountPath: /tmp
