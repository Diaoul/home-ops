---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-mcp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
# RBAC cannot subtract, so excluding Secrets means listing everything else: a new CRD
# group stays unreadable until it is added here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-mcp-readonly
rules:
  - nonResourceURLs:
      - /api
      - /api/*
      - /apis
      - /apis/*
      - /healthz
      - /livez
      - /openapi
      - /openapi/*
      - /readyz
      - /version
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
      - pods/log
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - acme.cert-manager.io
      - actions.github.com
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - barmancloud.cnpg.io
      - batch
      - ceph.rook.io
      - certificates.k8s.io
      - cert-manager.io
      - cilium.io
      - coordination.k8s.io
      - csi.ceph.io
      - deviceplugin.intel.com
      - discovery.k8s.io
      - dragonflydb.io
      - events.k8s.io
      - externaldns.k8s.io
      - flowcontrol.apiserver.k8s.io
      - fluxcd.controlplane.io
      - fpga.intel.com
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
      - grafana.integreatly.org
      - groupsnapshot.storage.k8s.io
      - helm.toolkit.fluxcd.io
      - k8s.cni.cncf.io
      - kaniop.rs
      - kopiur.home-operations.com
      - kustomize.toolkit.fluxcd.io
      - litellm.home-operations.com
      - metrics.k8s.io
      - miroir.home-operations.com
      - monitoring.coreos.com
      - monitoring.giantswarm.io
      - networking.k8s.io
      - nfd.k8s-sigs.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - objectbucket.io
      - observability.giantswarm.io
      - operator.victoriametrics.com
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - storagemigration.k8s.io
      - talos.dev
      - tuppr.home-operations.com
      - upgrade.cattle.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: cluster-mcp
    namespace: ai
