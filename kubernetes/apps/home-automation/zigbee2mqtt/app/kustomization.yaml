---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: zigbee2mqtt
    files:
      - source-route-table-size.cjs=./resources/source-route-table-size.cjs
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # The preload is JavaScript. Its ${...} template literals are not Flux
    # variables, and envsubst fails to parse them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
