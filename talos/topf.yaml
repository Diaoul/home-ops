# https://postfinance.github.io/topf/main/configuration/
---
clusterName: main
clusterEndpoint: https://10.0.3.3:6443

# Installer image only; rolling upgrades are driven by tuppr. Renovate reads this
# via the talosFactory preset, which groups it with tuppr's TalosUpgrade.
talosVersion: v1.13.9
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4

schematicId: "@schematic.yaml"
secureboot: true

secretsPath: secrets.sops.yaml

data:
  certSANs:
    - 127.0.0.1 # KubePrism
    - 10.0.3.2 # HAProxy LB
    - 10.0.3.3 # Cluster LB
    - k8s-apiserver
    - k8s-apiserver.milkyway
  podCIDR: 10.42.0.0/16
  svcCIDR: 10.43.0.0/16
  nodeCIDR: 10.0.3.0/24

# bond0 stays on DHCP and inherits DNS/NTP from it, hence no ResolverConfig or
# TimeSyncConfig documents.
nodes:
  - host: k8s-node-1
    ip: 10.0.3.24
    role: control-plane
    data:
      macAddr: 94:c6:91:a3:f7:a4
  - host: k8s-node-2
    ip: 10.0.3.25
    role: control-plane
    data:
      macAddr: 1c:69:7a:60:5f:cf
  - host: k8s-node-3
    ip: 10.0.3.26
    role: control-plane
    data:
      macAddr: 1c:69:7a:a3:1a:a1
  - host: k8s-node-4
    ip: 10.0.3.27
    role: worker
    data:
      macAddr: 1c:69:7a:07:22:5d
  - host: k8s-node-5
    ip: 10.0.3.28
    role: worker
    data:
      macAddr: 1c:69:7a:0e:da:8a
