---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 50GiB
---
# Backing store for miroir's LVM thin pool, replacing the OpenEBS local-hostpath
# user volume. Renaming the volume changes its partition label from
# u-local-hostpath to r-miroir, and Talos will not delete the old partition on its
# own — each node needs `talosctl wipe disk <dev> --drop-partition` after this
# applies, or the pool has nowhere to go on a full disk.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: miroir
provisioning:
  diskSelector:
    match: system_disk
  grow: true
  minSize: 50GiB
