---
# Needs acpi_no_watchdog (schematic.yaml), which only lands via a Talos upgrade.
# Applied to a node without a registered device, Talos' WatchdogTimerController
# crash-loops — upgrade a node before applying this to it.
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m
