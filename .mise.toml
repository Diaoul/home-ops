[env]
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
LEFTHOOK_OUTPUT = "false"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
uv = "latest"
lefthook = "latest"
age = "latest"
gum = "latest"
cilium-cli = "0.20.1"
cilium-hubble = "1.20.2"
cloudflared = "2026.10.6"
flux2 = "2.10.0"
sops = "latest"
yamlfmt = "latest"
helm = "latest"
"aqua:helmfile/helmfile" = "latest"
jq = "latest"
kustomize = "latest"
kubectl = "1.37.2"
yq = "latest"
talos = "1.14.5"
kubeconform = "0.8.0"
"github:home-operations/flate" = "0.6.5"
"github:postfinance/topf" = "0.6.2"
# --managed-python keeps uv off Arch's /usr/bin/python, which pacman removes on
# a minor upgrade. 3.14 is the newest controller Python ansible-core supports.
"pypi:ansible" = { version = "14.5.0", expose = ["ansible-core", "ansible-lint"], uvx_args = "--managed-python --python 3.14" }
"pypi:yamllint" = { version = "1.38.0", uvx_args = "--managed-python --python 3.14" }
