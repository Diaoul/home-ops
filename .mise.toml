[env]
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
LEFTHOOK_OUTPUT = "false"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
uv = "latest"
lefthook = "latest"
age = "latest"
gum = "latest"
cilium-cli = "0.20.3"
cilium-hubble = "1.20.4"
cloudflared = "2026.10.7"
flux2 = "2.10.0"
sops = "latest"
yamlfmt = "latest"
helm = "latest"
"aqua:helmfile/helmfile" = "latest"
jq = "latest"
kustomize = "latest"
kubectl = "1.37.2"
yq = "latest"
talos = "1.14.5"
kubeconform = "0.8.0"
"github:home-operations/flate" = "0.7.3"
crane = "0.22.1"
"github:postfinance/topf" = "0.6.2"
# python makes uv use mise's interpreter, not Arch's /usr/bin/python, which pacman
# removes on a minor upgrade. 3.14 is the newest controller Python ansible-core supports.
"pypi:ansible" = { version = "14.6.0", expose = ["ansible-core", "ansible-lint"], python = "3.14" }
"pypi:yamllint" = { version = "1.38.0", python = "3.14" }
