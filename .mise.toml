[env]
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
LEFTHOOK_OUTPUT = "false"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
uv = "latest"
"aqua:evilmartians/lefthook" = "latest"
"aqua:FiloSottile/age" = "latest"
"aqua:charmbracelet/gum" = "latest"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cilium/hubble" = "1.20.2"
"aqua:cloudflare/cloudflared" = "2026.10.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "latest"
"aqua:google/yamlfmt" = "latest"
"aqua:helm/helm" = "latest"
"aqua:helmfile/helmfile" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:kubernetes-sigs/kustomize" = "latest"
"aqua:kubernetes/kubectl" = "1.35.1"
"aqua:mikefarah/yq" = "latest"
"aqua:siderolabs/talos" = "1.14.4"
"aqua:yannh/kubeconform" = "0.8.0"
"github:home-operations/flate" = "0.6.5"
"github:postfinance/topf" = "0.6.1"
# --managed-python keeps uv off Arch's /usr/bin/python, which pacman removes on
# a minor upgrade. 3.14 is the newest controller Python ansible-core supports.
"pypi:ansible" = { version = "14.5.0", expose = ["ansible-core", "ansible-lint"], uvx_args = "--managed-python --python 3.14" }
"pypi:yamllint" = { version = "1.38.0", uvx_args = "--managed-python --python 3.14" }
