---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Validate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifests:
    name: Validate - Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          # uv: the pypi backend builds yamllint with it.
          install_args: uv just kubeconform kustomize sops yamlfmt yq pypi:yamllint github:home-operations/flate

      - name: Validate
        run: just validate
